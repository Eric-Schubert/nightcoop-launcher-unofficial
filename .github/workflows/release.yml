name: Release

# Pushing a tag such as v1.0.0 builds the launcher and publishes it as a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read the version from the tag
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: >
          dotnet publish src/NightCoopLauncher.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.number }} -o dist

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          # A version with a suffix (1.1.0-beta.1) is not meant for everyone yet.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          sha256=$(sha256sum dist/NightCoopLauncher.exe | cut -d ' ' -f 1)
          gh release create "$GITHUB_REF_NAME" dist/NightCoopLauncher.exe \
            --title "NightCoop Launcher $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "SHA-256 of NightCoopLauncher.exe: \`$sha256\`" \
            $prerelease
